<div class="min-h-screen flex">

  <!-- LEFT BLUE PANEL -->
  <div class="hidden md:flex w-1/2 bg-gradient-to-br from-slate-900 via-blue-900 to-blue-600 
              text-white items-center justify-center p-12">

    <div class="text-center max-w-md">

      <div class="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-6">
        <span class="material-icons text-white text-4xl">shield</span>
      </div>

      <h1 class="text-4xl font-bold mb-4">Welcome Back</h1>

      <p class="text-blue-100 text-lg leading-relaxed">
        Access your insurance dashboard and manage policies,
        claims, and documents with ease.
      </p>

    </div>
  </div>


  <!-- RIGHT LOGIN FORM -->
  <div class="w-full md:w-1/2 flex items-center justify-center bg-slate-50 p-6">

    <div class="w-full max-w-md bg-white p-8 rounded-xl shadow-lg">

      <!-- Heading -->
      <h2 class="text-3xl font-bold text-slate-900 mb-2">Sign In</h2>
      <p class="text-slate-600 mb-8">
        Enter your credentials to access your account
      </p>

      <!-- FORM START -->
      <form (ngSubmit)="login()" #loginForm="ngForm">

        <!-- Email -->
        <label class="block text-slate-700 font-medium mb-2">
          Email Address
        </label>

        <div class="relative mb-5">
          <span class="material-icons absolute left-3 top-3 text-slate-400">mail</span>

          <input type="email"
            name="email"
            [(ngModel)]="email"
            required
            class="w-full pl-10 pr-4 py-3 border rounded-lg outline-none 
                   focus:ring-2 focus:ring-blue-600"
            placeholder="name@company.com">
        </div>

        <!-- Password -->
        <div class="flex justify-between items-center mb-2">
          <label class="text-slate-700 font-medium">Password</label>
          <a href="#" class="text-blue-600 text-sm hover:underline">
            Forgot password?
          </a>
        </div>

        <div class="relative mb-6">
          <span class="material-icons absolute left-3 top-3 text-slate-400">lock</span>

          <input 
            name="password"
            [(ngModel)]="password"
            [type]="showPassword ? 'text' : 'password'"
            required
            class="w-full pl-10 pr-10 py-3 border rounded-lg outline-none 
                   focus:ring-2 focus:ring-blue-600"
            placeholder="••••••••">

          <span 
            class="material-icons absolute right-3 top-3 text-slate-400 cursor-pointer"
            (click)="togglePassword()">
            {{ showPassword ? 'visibility_off' : 'visibility' }}
          </span>
        </div>

        <!-- Button -->
        <button 
          type="submit"
          class="w-full bg-blue-700 text-white py-3 rounded-lg font-semibold 
                 hover:bg-blue-800 transition">

          Sign In
        </button>

      </form>
      <!-- FORM END -->

      <!-- Register Link -->
      <p class="text-center text-slate-600 mt-6">
        Don't have an account?
        <a routerLink="/register" class="text-blue-600 font-medium hover:underline">
          Create Account
        </a>
      </p>

      <!-- Back to home -->
      <div class="text-center mt-4">
        <a routerLink="/" class="text-slate-500 hover:underline text-sm">
          ← Back to Home
        </a>
      </div>

    </div>
  </div>

</div>
