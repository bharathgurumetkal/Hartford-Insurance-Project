<div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
  <div class="overflow-x-auto">
<table class="min-w-full text-sm text-gray-700 ">
    <thead class="bg-blue-200 sticky top-0 z-10">
      <tr>
        <th *ngFor="let col of columns"
            class="px-6 py-3 text-left text-xs font-semibold tracking-wider text-gray uppercase">
          {{ col }}
        </th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let row of data; let i=index" class="transition hover:bg-gray-50" [ngClass]="{'bg-gray-400/10':i%2==0,'bg-blue-400/10':i%2!=0}">
        <td *ngFor="let key of keys" class="px-6 py-4 whitespace-nowrap">
          {{ row[key] }}
        </td>
      </tr>

      <tr *ngIf="!data || data.length === 0">
          <td [attr.colspan]="columns.length"
              class="px-6 py-10 text-center text-gray-400">
            No records found
          </td>
        </tr> 

    </tbody>
  </table>
  </div>
  
</div>
