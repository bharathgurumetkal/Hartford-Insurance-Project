<div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">

  <table class="w-full text-sm text-gray-700">

    <!-- ===== Table Header ===== -->
    <thead class="bg-gray-100/70 border-b">
      <tr>
        <th
          *ngFor="let col of columns"
          class="px-6 py-4 text-left text-[11px] font-semibold uppercase tracking-widest text-gray-600">
          {{ col }}
        </th>
      </tr>
    </thead>

    <!-- ===== Table Body ===== -->
    <tbody>

      <tr
        *ngFor="let row of data; let i = index"
        class="group transition
               odd:bg-white even:bg-gray-50
               hover:bg-blue-50/40">

        <!-- ===== Data Cells ===== -->
        <td
          *ngFor="let key of keys"
          class="px-6 py-4 whitespace-nowrap">

          <!-- Status Badge Styling -->
          <ng-container *ngIf="key === 'status'; else normalCell">
            <span
              class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium"
              [ngClass]="{
                'bg-yellow-100 text-yellow-700': row[key] === 'Pending',
                'bg-green-100 text-green-700': row[key] === 'Approved',
                'bg-red-100 text-red-700': row[key] === 'Rejected'
              }">
              {{ row[key] }}
            </span>
          </ng-container>

          <ng-template #normalCell>
            <span class="font-medium text-gray-800">
              {{ row[key] }}
            </span>
          </ng-template>

        </td>

        <!-- ===== Actions Column ===== -->
        <td
          *ngIf="actionsTemplate"
          class="px-6 py-4 text-right">

          <ng-container
            *ngTemplateOutlet="actionsTemplate; context: { $implicit: row }">
          </ng-container>

        </td>
      </tr>

      <!-- ===== Empty State ===== -->
      <tr *ngIf="data.length === 0">
        <td
          [attr.colspan]="columns.length"
          class="px-6 py-14 text-center">

          <div class="flex flex-col items-center gap-2 text-gray-400">
            <span class="material-icons text-4xl">inbox</span>
            <p class="text-sm">No records found</p>
          </div>

        </td>
      </tr>

    </tbody>

  </table>
</div>
