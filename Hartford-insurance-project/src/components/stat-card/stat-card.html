<div
  class="bg-white p-6 rounded-xl shadow-sm border border-slate-100
         flex justify-between items-start">

  <!-- Left content -->
  <div>
    <p class="text-slate-500 text-sm mb-1">
      {{ title }}
    </p>

    <h2 class="text-4xl font-bold text-slate-900">
      {{ value }}
    </h2>

    <p
      class="text-xs font-medium mt-2"
      [ngClass]="trendColor">
      {{ trend }}
    </p>
  </div>

  <!-- Right icon -->
  <div
    class="w-12 h-12 rounded-lg flex items-center justify-center"
    [ngClass]="iconBg">
    <span class="material-icons" [ngClass]="iconColor">
      {{ icon }}
    </span>
  </div>

</div>
