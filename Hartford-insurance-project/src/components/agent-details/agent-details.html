<div class="mt-4 p-4 bg-gray-50 rounded-xl border">
  <div class="flex justify-between mb-3">
    <h3 class="font-semibold text-gray-800">
      Agent {{ agent.email }}
    </h3>

    <span class="text-sm text-gray-500">
      Policies Assigned: {{ policyCount }}
    </span>
  </div>

  <div class="grid grid-cols-2 gap-4 text-sm">
    <div>
      <p class="font-medium mb-1">Assigned Customers</p>
      <ul class="list-disc ml-5 text-gray-600">
        <li *ngFor="let c of assignedCustomers">
          {{ c.fullName || c.email }}
        </li>
      </ul>
    </div>

    <div>
      <p class="font-medium mb-1">Summary</p>
      <p>Customers: {{ assignedCustomers.length }}</p>
      <p>Policies: {{ policyCount }}</p>
    </div>
  </div>
</div>
