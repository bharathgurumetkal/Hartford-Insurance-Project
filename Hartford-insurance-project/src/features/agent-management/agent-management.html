<div class="flex items-center justify-between mb-6">
  <h1 class="text-xl font-semibold text-gray-800">
    Agent Management
  </h1>

  <button
    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
    (click)="openAddModal()">
    + Add Agent
  </button>
</div>

<app-data-table
  [columns]="columns"
  [keys]="keys"
  [data]="agents"
  [actionsTemplate]="actionsTpl">
</app-data-table>

<ng-template #actionsTpl let-agent>
  <button
    class="px-3 py-1 text-sm font-medium text-red-600
           hover:bg-red-50 rounded-md transition"
    (click)="openDeleteModal(agent.id)">
    Delete
  </button>
</ng-template>


<app-confirm-modal
  *ngIf="showConfirmModal"
  title="Delete Agent"
  message="Are you sure you want to delete this agent? This action cannot be undone."
  (confirm)="confirmDelete()"
  (cancel)="showConfirmModal = false">
</app-confirm-modal>

<app-add-agent-modal
  *ngIf="showAddModal"
  (close)="showAddModal = false"
  (agentAdded)="onAgentAdded()">
</app-add-agent-modal>
