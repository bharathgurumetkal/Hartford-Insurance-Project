<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-slate-900 text-white flex flex-col">

    <!-- Logo -->
    <div class="p-6 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
          <span class="material-icons text-white text-2xl">shield</span>
        </div>
        <div>
          <h1 class="text-lg font-bold">InsureFlow</h1>
          <p class="text-xs text-slate-400">{{ getRoleDisplayName() }}</p>
        </div>
      </div>
    </div>

    <!-- Menu -->
    <nav class="flex-1 p-4 space-y-2">
      <ng-container *ngFor="let item of menuItems">
        <a [routerLink]="item.route"
           routerLinkActive="bg-blue-600 text-white"
           [routerLinkActiveOptions]="{ exact: item.route === 'dashboard' }"
           class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-slate-800 transition">
          <span class="material-icons text-lg">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      </ng-container>
    </nav>

    <!-- Logout -->
    <div class="p-4 border-t border-slate-800">
      <button (click)="logout()" class="flex items-center gap-3 text-slate-400 hover:text-white transition w-full">
        <span class="material-icons">logout</span>
        Logout
      </button>
    </div>

  </aside>


  <!-- MAIN CONTENT AREA -->
  <div class="flex-1 bg-slate-50">

    <!-- TOP NAVBAR -->
    <header class="bg-white border-b px-6 py-4 flex justify-between items-center">
      <h2 class="text-xl font-semibold text-slate-900">Dashboard</h2>

      <div class="flex items-center gap-4">
        <div class="text-right">
          <p class="text-sm font-medium">{{ userName }}</p>
          <p class="text-xs text-slate-500">{{ getRoleDisplayName() }}</p>
        </div>
        <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold">
          {{ userInitials }}
        </div>
      </div>
    </header>

    <!-- DYNAMIC CONTENT -->
    <main class="p-6">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
